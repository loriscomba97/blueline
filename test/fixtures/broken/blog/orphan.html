<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A page nobody links to | Example</title>
  <meta name="description" content="This page is listed in the sitemap, but no other page links to it.">
  <link rel="canonical" href="{{origin}}/blog/orphan">
</head>
<body>
  <main>
    <h1>A page nobody links to</h1>
    <p>This page is listed in the sitemap. No other page of the site links to it, so crawlers that follow links never reach it, and readers never find it either.</p>
  </main>
</body>
</html>
